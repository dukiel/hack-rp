<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Terminal Hextec - Acesso Restrito</title>
    <style>
        body {
            background-color: #010a13;
            color: #c8aa6e;
            text-align: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background-color: #c8aa6e;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh); opacity: 0.8; }
            to { transform: translateY(-10vh); opacity: 0; }
        }
        .container {
            border: 2px solid #c8aa6e;
            padding: 40px;
            background: rgba(1, 10, 19, 0.85);
            box-shadow: 0 0 25px #c8aa6e;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px);
        }
        .chest-container {
            margin: 0 auto 20px auto;
            width: 80px;
            height: 80px;
            position: relative;
            animation: floatChest 3s ease-in-out infinite;
        }
        @keyframes floatChest {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .chest-lid {
            transform-origin: bottom center;
            animation: openLid 2.5s alternate infinite ease-in-out;
        }
        @keyframes openLid {
            0%, 15% { transform: translateY(0) rotateX(0deg); }
            85%, 100% { transform: translateY(-8px) rotateX(25deg); }
        }
        h1 { color: #f0e6d2; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 18px; max-width: 450px; margin: 10px auto; line-height: 1.5; }
        .rp-destaque { color: #0ac8b9; font-weight: bold; font-size: 22px; text-shadow: 0 0 8px #0ac8b9; }
        .mensagem { font-style: italic; color: #a09b8c; font-size: 14px; margin-bottom: 30px; }
        button {
            padding: 15px 30px;
            background: linear-gradient(180deg, #1e2328, #433f32);
            border: 2px solid #c8aa6e;
            color: #f0e6d2;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { background: #c8aa6e; color: #010a13; box-shadow: 0 0 15px #c8aa6e; }
        #codigo {
            font-size: 28px;
            letter-spacing: 4px;
            margin-top: 30px;
            color: #0ac8b9;
            text-shadow: 0 0 10px #0ac8b9;
            height: 35px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <div class="chest-container">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="20,50 80,50 90,90 10,90" fill="#1e2328" stroke="#c8aa6e" stroke-width="3"/>
                <line x1="15" y1="70" x2="85" y2="70" stroke="#c8aa6e" stroke-width="1.5" opacity="0.5"/>
                <line x1="50" y1="50" x2="50" y2="90" stroke="#c8aa6e" stroke-width="1.5" opacity="0.5"/>
                <g class="chest-lid">
                    <polygon points="10,45 90,45 80,15 20,15" fill="#1e2328" stroke="#c8aa6e" stroke-width="3"/>
                    <circle cx="50" cy="45" r="10" fill="#0ac8b9" stroke="#c8aa6e" stroke-width="2"/>
                    <circle cx="50" cy="45" r="4" fill="#ffffff" opacity="0.8"/>
                </g>
            </svg>
        </div>

        <h1>SISTEMA HEXTEC INFILTRADO</h1>
        <p>Transferência concluída. <span class="rp-destaque">1830 RP</span> injetados na conta <strong>mono trash#yse</strong>.</p>
        <p class="mensagem">Vê se com skin nova tu para de culpar o hardware e foca em não feedar na minha lane. <br><br>Operação executada por: <strong>Dukiel#1337</strong></p>
        
        <button id="btn-decodificar" onclick="iniciarDecriptacao()">Decriptar Chave de Acesso</button>
        <div id="codigo"></div>
    </div>

    <script>
        // Substitua o valor abaixo pelo código real de RP
        const CODIGO_REAL = "XXXX-XXXX-XXXX-XXXX"; 

        function iniciarDecriptacao() {
            const btn = document.getElementById('btn-decodificar');
            const codeElement = document.getElementById('codigo');
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            
            btn.style.display = 'none'; // Some com o botão após clicar
            
            let iteration = 0;
            const speed = 40; // Velocidade da troca de letras (ms)
            const lettersPerTick = 1/3; // Quantidade de letras reveladas por tick
            
            const interval = setInterval(() => {
                let currentText = CODIGO_REAL.split('').map((letter, index) => {
                    if (letter === '-') return '-';
                    if (index < Math.floor(iteration * lettersPerTick)) {
                        return CODIGO_REAL[index];
                    }
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                codeElement.innerText = currentText;
                
                if (iteration * lettersPerTick >= CODIGO_REAL.length) {
                    clearInterval(interval);
                    codeElement.innerText = CODIGO_REAL;
                }
                
                iteration++;
            }, speed);
        }

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 70; i++) {
            let particle = document.createElement('div');
            particle.className = 'particle';
            let size = Math.random() * 4 + 1;
            let posX = Math.random() * 100;
            let delay = Math.random() * 5;
            let duration = Math.random() * 4 + 3;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = posX + 'vw';
            particle.style.animationDelay = delay + 's';
            particle.style.animationDuration = duration + 's';
            
            if(Math.random() > 0.7) {
                particle.style.backgroundColor = '#0ac8b9';
            }
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
